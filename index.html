<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => { let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; try { const saved = localStorage.getItem('placement-theme'); if (saved === 'dark' || saved === 'light') theme = saved; } catch {} document.documentElement.dataset.theme = theme; })();
    </script>
    <link rel="preload" href="/fonts/lora/normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lora/italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html { background:#f7f7ef; color-scheme:light; }
      html[data-theme=dark] { background:#101411; color-scheme:dark; }
      body { margin:0; }
      .boot-shell { --boot-bar:#e5e6de; max-width:1352px; margin:auto; padding:16px 24px; font-family:system-ui,sans-serif; }
      [data-theme=dark] .boot-shell { --boot-bar:#232b27; }
      .boot-header { display:flex; align-items:center; gap:16px; height:80px; box-sizing:border-box; padding:12px 24px; border:1px solid var(--boot-bar); border-radius:22px; margin-bottom:100px; }
      .boot-bar { display:block; position:relative; overflow:hidden; height:12px; width:100%; background:var(--boot-bar); border-radius:4px; }
      .boot-bar::after { content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent,#ffffff22,transparent); animation:boot-shimmer 1.8s ease-in-out infinite; }
      .boot-mark { width:42px; height:42px; flex:none; }.boot-name { width:140px; }.boot-avatar { width:44px; height:44px; margin-left:auto; border-radius:50%; }
      .boot-intro { display:grid; gap:14px; max-width:600px; margin-bottom:40px; }.boot-title { height:48px; width:64%; }.boot-medium { width:76%; }
      .boot-cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }.boot-card { display:grid; align-content:start; gap:14px; padding:24px; min-height:160px; box-sizing:border-box; border:1px solid var(--boot-bar); border-radius:8px; }
      .boot-sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
      @keyframes boot-shimmer { from{transform:translateX(-100%)}to{transform:translateX(100%)} }
      @media(max-width:760px) { .boot-shell{padding:10px 16px}.boot-header{padding:12px;height:72px;margin-bottom:52px;border-radius:18px}.boot-title{height:34px}.boot-cards{grid-template-columns:1fr;gap:14px} }
      @media(prefers-reduced-motion:reduce) { .boot-bar::after{animation:none;display:none} }
    </style>
    <meta name="description" content="Source-backed placement intelligence for KJSCE. Explore historical batches, companies, roles and hiring patterns, with reviewed community experiences." />
    <title>Placement Stats — A clearer perspective for KJSCE</title>
    <link rel="canonical" href="https://kjsce-placements.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Placement Stats" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://kjsce-placements.vercel.app/" />
    <meta property="og:title" content="Placement Stats — Know more. Go further." />
    <meta property="og:description" content="Placement intelligence for KJSCE. Explore source-backed placement records, firsthand hiring experiences and connections across batches." />
    <meta property="og:image" content="https://kjsce-placements.vercel.app/social/placement-stats-preview.png" />
    <meta property="og:image:secure_url" content="https://kjsce-placements.vercel.app/social/placement-stats-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Placement Stats: Know more. Go further. Placement intelligence for KJSCE — records, experiences and alumni connections." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Placement Stats — Know more. Go further." />
    <meta name="twitter:description" content="Placement intelligence for KJSCE. Source-backed records, firsthand hiring experiences and connections across batches." />
    <meta name="twitter:image" content="https://kjsce-placements.vercel.app/social/placement-stats-preview.png" />
    <meta name="twitter:image:alt" content="Placement Stats: Know more. Go further. Placement intelligence for KJSCE — records, experiences and alumni connections." />
  </head>
  <body>
    <div id="root"><div class="boot-shell" role="status"><span class="boot-sr">Loading Placement Stats…</span><div aria-hidden="true"><div class="boot-header"><span class="boot-bar boot-mark"></span><span class="boot-bar boot-name"></span><span class="boot-bar boot-avatar"></span></div><div class="boot-intro"><span class="boot-bar boot-title"></span><span class="boot-bar"></span><span class="boot-bar boot-medium"></span></div><div class="boot-cards"><div class="boot-card"><span class="boot-bar boot-title"></span><span class="boot-bar"></span><span class="boot-bar boot-medium"></span></div><div class="boot-card"><span class="boot-bar boot-title"></span><span class="boot-bar"></span><span class="boot-bar boot-medium"></span></div><div class="boot-card"><span class="boot-bar boot-title"></span><span class="boot-bar"></span><span class="boot-bar boot-medium"></span></div></div></div></div></div>
    <noscript>Placement Stats needs JavaScript to load placements and sign in. Please enable it in your browser.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
